name: Build and publish Intel ML API

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dafr0n/obico-ml-intel
  UPSTREAM_REPOSITORY: https://github.com/TheSpaghettiDetective/obico-server.git
  UPSTREAM_COMMIT: df8190ef7500459599ebf398c3d1f653754792fd

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Check out pinned Obico source
        shell: bash
        run: |
          git clone --no-checkout "${UPSTREAM_REPOSITORY}" upstream
          git -C upstream fetch --depth 1 origin "${UPSTREAM_COMMIT}"
          git -C upstream checkout --detach "${UPSTREAM_COMMIT}"
          test "$(git -C upstream rev-parse HEAD)" = "${UPSTREAM_COMMIT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./upstream/ml_api
          file: ./upstream/ml_api/Dockerfile.intel
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
